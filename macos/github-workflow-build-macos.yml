name: Build GroundAtlas Desktop (macOS Apple Silicon & Intel)

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Kiến trúc macOS cần build (arm64 = M1/M2/M3/M4, x86_64 = Intel Mac, both = cả 2)"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
          - both
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_VERSION: "2.3.1"
  MAPLIBRE_QT_COMMIT: "d929c783737120787b43417d9ef05da88da75dfd"
  QT_VERSION: "6.8.3"

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (arm64 · M1–M4)
    runs-on: macos-14
    if: ${{ github.event_name == 'push' || inputs.target_arch == 'arm64' || inputs.target_arch == 'both' }}
    steps:
      - name: Checkout Private Source Repo
        uses: actions/checkout@v4

      - name: Install build tools (Ninja, librsvg for Retina .icns)
        run: |
          brew install ninja librsvg

      - name: Install Qt ${{ env.QT_VERSION }} (macOS desktop)
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cached: 'true'

      - name: Resolve Qt root prefix
        run: |
          QT_PREFIX="${QT_ROOT_DIR:-${Qt6_DIR}}"
          if [[ "${QT_PREFIX}" == */lib/cmake/Qt6 ]]; then
            QT_PREFIX="$(cd "${QT_PREFIX}/../../.." && pwd)"
          fi
          echo "QT_PREFIX=${QT_PREFIX}" >> "${GITHUB_ENV}"
          echo "Resolved QT_PREFIX=${QT_PREFIX}"

      - name: Restore cached MapLibre Native Qt 3.0.0 Patched (arm64)
        id: cache-maplibre
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/maplibre-install
          key: maplibre-qt-3.0.0-patched-qt${{ env.QT_VERSION }}-gl-arm64-v2

      - name: Build MapLibre Native Qt 3.0.0 + GroundAtlas Custom Projection Patch (arm64)
        if: steps.cache-maplibre.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/maplibre-src"
          git -C "${RUNNER_TEMP}/maplibre-src" init
          git -C "${RUNNER_TEMP}/maplibre-src" remote add origin https://github.com/maplibre/maplibre-native-qt.git
          git -C "${RUNNER_TEMP}/maplibre-src" fetch --depth 1 origin "${MAPLIBRE_QT_COMMIT}"
          git -C "${RUNNER_TEMP}/maplibre-src" checkout FETCH_HEAD
          git -C "${RUNNER_TEMP}/maplibre-src" submodule update --init --recursive --depth 1
          python3 scripts/patch-maplibre.py "${RUNNER_TEMP}/maplibre-src"
          cmake -S "${RUNNER_TEMP}/maplibre-src" -B "${RUNNER_TEMP}/maplibre-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/maplibre-install" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DQT_VERSION_MAJOR=6 \
            -DMLN_WITH_OPENGL=ON \
            -DMLN_WITH_METAL=OFF \
            -DMLN_QT_WITH_LOCATION=OFF \
            -DMLN_QT_WITH_WIDGETS=OFF \
            -DMLN_QT_WITH_INTERNAL_SQLITE=ON \
            -DMLN_QT_STATIC=OFF \
            -DMLN_WITH_WERROR=OFF \
            -DBUILD_TESTING=OFF
          cmake --build "${RUNNER_TEMP}/maplibre-build" --target MLNQtCore --parallel
          cmake --install "${RUNNER_TEMP}/maplibre-build"
          rm -rf "${RUNNER_TEMP}/maplibre-src" "${RUNNER_TEMP}/maplibre-build"

      - name: Configure & Build GroundAtlas Desktop (C++20 Release, arm64)
        run: |
          set -euo pipefail
          cmake -S . -B build-macos-rel -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX};${RUNNER_TEMP}/maplibre-install" \
            -DBUILD_TESTING=ON
          cmake --build build-macos-rel --parallel --target \
            GroundAtlas \
            native_core_tests \
            native_data_tests \
            native_license_tests \
            native_session_tests \
            native_vector_context_tests

      - name: Run Native C++20 Unit Tests on macOS (incl. IOPlatformUUID & Monocypher AEAD)
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="${RUNNER_TEMP}/maplibre-install/lib:${QT_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          ctest --test-dir build-macos-rel --output-on-failure \
            -R "^(native_core|native_data|native_license|native_session|native_vector_context)$"

      - name: Package GroundAtlas Desktop .app + .dmg & SHA-256
        env:
          BUILD_DIR: ${{ github.workspace }}/build-macos-rel
          QT_DIR: ${{ env.QT_PREFIX }}
          MAPLIBRE_PREFIX: ${{ runner.temp }}/maplibre-install
          OUT_DIR: ${{ github.workspace }}/dist-macos
          ARCH_NAME: arm64
        run: |
          chmod +x macos/build-dmg.sh
          ./macos/build-dmg.sh

      - name: Upload macOS Apple Silicon .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroundAtlas-Desktop-${{ env.APP_VERSION }}-macOS-arm64
          path: |
            dist-macos/*.dmg
            dist-macos/SHA256SUMS-macos-arm64.txt
          retention-days: 30

  build-macos-x86_64:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    if: ${{ inputs.target_arch == 'x86_64' || inputs.target_arch == 'both' }}
    steps:
      - name: Checkout Private Source Repo
        uses: actions/checkout@v4

      - name: Install build tools (Ninja, librsvg for Retina .icns)
        run: |
          brew install ninja librsvg

      - name: Install Qt ${{ env.QT_VERSION }} (macOS desktop)
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cached: 'true'

      - name: Resolve Qt root prefix
        run: |
          QT_PREFIX="${QT_ROOT_DIR:-${Qt6_DIR}}"
          if [[ "${QT_PREFIX}" == */lib/cmake/Qt6 ]]; then
            QT_PREFIX="$(cd "${QT_PREFIX}/../../.." && pwd)"
          fi
          echo "QT_PREFIX=${QT_PREFIX}" >> "${GITHUB_ENV}"
          echo "Resolved QT_PREFIX=${QT_PREFIX}"

      - name: Restore cached MapLibre Native Qt 3.0.0 Patched (x86_64)
        id: cache-maplibre
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/maplibre-install
          key: maplibre-qt-3.0.0-patched-qt${{ env.QT_VERSION }}-gl-x86_64-v2

      - name: Build MapLibre Native Qt 3.0.0 + GroundAtlas Custom Projection Patch (x86_64)
        if: steps.cache-maplibre.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/maplibre-src"
          git -C "${RUNNER_TEMP}/maplibre-src" init
          git -C "${RUNNER_TEMP}/maplibre-src" remote add origin https://github.com/maplibre/maplibre-native-qt.git
          git -C "${RUNNER_TEMP}/maplibre-src" fetch --depth 1 origin "${MAPLIBRE_QT_COMMIT}"
          git -C "${RUNNER_TEMP}/maplibre-src" checkout FETCH_HEAD
          git -C "${RUNNER_TEMP}/maplibre-src" submodule update --init --recursive --depth 1
